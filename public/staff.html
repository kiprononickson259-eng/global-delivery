<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff portal – Global Delivery Services</title>
  <style>
    :root { --brand: #0d3b66; --accent: #f26b21; --bg: #f4f6f8; --line: #dde2e7; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #1b1f23; }
    header { background: var(--brand); color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header h1 { margin: 0; font-size: 1.15rem; }
    header span { color: var(--accent); }
    header small { display: block; opacity: .8; font-weight: 400; font-size: .8rem; }
    header button { width: auto; background: transparent; border: 1px solid rgba(255,255,255,.6); padding: 6px 14px; margin: 0; }
    main { max-width: 600px; margin: 0 auto; padding: 16px; }
    input, select, textarea, button { font: inherit; padding: 11px; width: 100%; margin: 4px 0; border-radius: 6px; border: 1px solid var(--line); }
    button { background: var(--accent); color: #fff; border: 0; cursor: pointer; font-weight: 600; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 12px 0; }
    .row { display: flex; gap: 8px; }
    .error { color: #c62828; }
    .ok { color: #2e7d32; }
    .code { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; color: var(--brand); }
    @page { margin: 0; }
    .qr { text-align: center; margin: 10px 0 2px; }
    .qr img { width: 170px; height: 170px; image-rendering: pixelated; display: inline-block; }
    .qr-note { text-align: center; font-size: .85rem; color: #667; }
    .label-name { text-align: center; font-weight: 700; color: var(--brand); margin-bottom: 4px; }
    .barcode { display: block; width: 100%; max-width: 100%; height: auto; margin: 8px auto; }
    .barcode-label { text-align: center; font-weight: 700; letter-spacing: 1px; }
    @media print {
      body * { visibility: hidden; }
      #barcodePrint, #barcodePrint * { visibility: visible; }
      #barcodePrint { position: absolute; inset: 0; width: 100%; padding: 24px; }
      #barcodePrint button { display: none; }
    }
    .parcel { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: .92rem; }
    .parcel:last-child { border: 0; }
    .hidden { display: none; }
    .del { width: auto; background: #c62828; padding: 4px 12px; font-size: .8rem; margin-top: 6px; }
    h3 { margin: 16px 0 4px; }
    .login-box { max-width: 380px; margin: 40px auto; }
    .login-box a { color: var(--brand); font-size: .9rem; }
  </style>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <header>
    <h1>Global <span>Delivery</span> Services <small>Staff portal</small></h1>
    <div><small id="who" class="hidden"></small> <button id="lockBtn" class="hidden" onclick="lock()">Sign out</button></div>
  </header>

  <main>
    <!-- LOGIN -->
    <div id="login" class="card login-box">
      <h3 style="margin-top:0">Staff sign in</h3>
      <input id="user" placeholder="Username" autocomplete="username" />
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password" />
      <button onclick="unlock()">Sign in</button>
      <div id="loginMsg"></div>
      <p><a href="/">← Customer tracking page</a></p>
    </div>

    <!-- STAFF PANEL -->
    <div id="panel" class="hidden">
      <h3>Register new parcel</h3>
      <div class="card">
        <input id="tnum" placeholder="Tracking number (leave empty to auto-generate)" />
        <div class="row"><input id="sname" placeholder="Sender name" /><input id="sphone" placeholder="Sender phone" /></div>
        <div class="row"><input id="rname" placeholder="Receiver name" /><input id="rphone" placeholder="Receiver phone" /></div>
        <div class="row"><input id="origin" placeholder="From (town)" /><input id="dest" placeholder="To (town)" /></div>
        <input id="desc" placeholder="Contents (e.g. Documents, clothes)" />
        <input id="transport" placeholder="Flight or vehicle used (optional, e.g. Flight KQ 100 or Truck KDA 123X)" />
        <input id="weight" type="number" step="0.1" placeholder="Weight in kg" />
        <button onclick="createParcel()">Create parcel</button>
        <div id="created"></div>
      </div>

      <h3>Add status update</h3>
      <div class="card">
        <input id="ucode" placeholder="Tracking number" />
        <select id="status"></select>
        <input id="location" placeholder="Location (e.g. Nairobi hub)" />
        <input id="utransport" placeholder="Flight or vehicle used (e.g. Flight KQ 100 or Truck KDA 123X)" />
        <input id="note" placeholder="Note (optional)" />
        <button onclick="addEvent()">Add update</button>
        <div id="updated"></div>
      </div>

      <h3>Payment receipt</h3>
      <div class="card">
        <input id="pcode" placeholder="Tracking number" onchange="loadReceipts()" />
        <input id="pitem" value="Delivery fee" placeholder="Item (e.g. Delivery fee)" />
        <div class="row"><input id="pqty" type="number" min="1" step="1" value="1" placeholder="Qty" /><input id="pamount" type="number" min="0" step="0.01" placeholder="Delivery fee paid (before tax)" /></div>
        <div class="row"><input id="pcurrency" placeholder="Currency (e.g. KES)" /><input id="ptax" type="number" min="0" max="100" step="0.01" placeholder="Tax %" /></div>
        <select id="pmethod"><option>Cash</option><option>M-Pesa</option><option>Card</option><option>Bank transfer</option><option>Other</option></select>
        <input id="ppaidby" placeholder="Received from (customer name)" />
        <button onclick="issueReceipt()">Issue receipt</button>
        <div id="receiptMsg"></div>
        <div id="receiptList"></div>
        <div id="receiptView"></div>
      </div>

      <h3>Recent parcels</h3>
      <div class="card">
        <input id="search" placeholder="Search by number or name" oninput="loadParcels()" />
        <div id="list"></div>
      </div>

      <h3>My account</h3>
      <div class="card">
        <input id="curpw" type="password" placeholder="Current password" />
        <input id="newpw" type="password" placeholder="New password (8+ characters)" />
        <button onclick="changePassword()">Change password</button>
        <div id="pwmsg"></div>
      </div>

      <div id="adminOnly" class="hidden">
        <h3>Staff accounts</h3>
        <div class="card">
          <input id="nusername" placeholder="Username (e.g. mary)" />
          <input id="nfull" placeholder="Full name" />
          <input id="npass" type="password" placeholder="Temporary password (8+ characters)" />
          <select id="nrole"><option value="staff">Staff</option><option value="admin">Admin</option></select>
          <button onclick="addUser()">Create account</button>
          <div id="usermsg"></div>
          <div id="users"></div>
        </div>
        <h3>Activity log</h3>
        <div class="card">
          <button class="del" style="margin:0 0 8px" onclick="clearActivity()">Clear all</button>
          <div id="activity"></div>
        </div>
      </div>
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = sessionStorage.getItem('gds_token') || '';
let me = null;
let lastRows = [];

// Accepts a plain tracking number OR a scanned link (https://site/t/NUMBER or ...?code=NUMBER)
function extractCode(v) {
  v = String(v || '').trim();
  const m = v.match(/[?&]code=([^&#\s]+)/i) || v.match(/\/t\/([^/?#\s]+)/i);
  return (m ? decodeURIComponent(m[1]) : v).trim();
}


function renderBarcodes(root = document) {
  root.querySelectorAll('svg[data-barcode]').forEach((svg) => {
    try {
      // The bars hold the full tracking link, so a scanner app can open it in the browser; the text shows the number
      JsBarcode(svg, svg.dataset.value || svg.dataset.barcode, {
        format: 'CODE128', displayValue: true, text: svg.dataset.barcode, font: 'monospace', width: 2, height: 70, margin: 8
      });
    } catch (error) {
      svg.insertAdjacentHTML('afterend', '<p class="error">Could not generate barcode.</p>');
      svg.remove();
    }
  });
}

function renderQRs(root) {
  root.querySelectorAll('[data-qr]').forEach((el) => {
    try {
      const qr = qrcode(0, 'M');
      qr.addData(el.dataset.qr);
      qr.make();
      el.innerHTML = qr.createImgTag(6, 2, 'QR code to track this parcel');
    } catch (e) {
      el.textContent = 'QR code unavailable';
    }
  });
}

function labelHtml(code, heading) {
  const link = location.origin + '/t/' + encodeURIComponent(code);
  const name = (window.SITE && window.SITE.name) || 'Global Delivery Services';
  return `<div id="barcodePrint" class="card">
    ${heading ? `<p class="ok">${esc(heading)}</p>` : ''}
    <div class="label-name">${esc(name)}</div>
    <div class="code" style="text-align:center">${esc(code)}</div>
    <div class="qr" data-qr="${esc(link)}"></div>
    <div class="qr-note">Scan to track this parcel</div>
    <svg class="barcode" data-barcode="${esc(code)}" data-value="${esc(link)}" aria-label="Barcode for ${esc(code)}"></svg>
    <button type="button" onclick="window.print()">Print label</button>
  </div>`;
}

async function showLabel(code) {
  const r = await api('GET', '/api/parcels/' + encodeURIComponent(code) + '/label');
  if (!r.ok) { $('created').innerHTML = `<p class="error">${esc(r.data.error)}</p>`; return; }
  $('created').innerHTML = labelHtml(r.data.tracking_number, '');
  renderBarcodes($('created'));
  renderQRs($('created'));
  $('created').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function printBarcode() { window.print(); }

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined
  });
  let data;
  try { data = await res.json(); }
  catch (e) { data = { error: 'The server could not do this (error ' + res.status + '). Check that the newest app.js is uploaded on GitHub (main page, not a folder) and that the latest Netlify deploy says Published.' }; }
  if (res.status === 401 && me) { lock('Your session ended. Please sign in again.'); }
  return { ok: res.ok, data };
}

async function showPanel() {
  $('login').classList.add('hidden');
  $('panel').classList.remove('hidden');
  $('lockBtn').classList.remove('hidden');
  $('who').textContent = me.full_name + ' (' + me.role + ')';
  $('who').classList.remove('hidden');
  const statuses = await (await fetch('/api/statuses')).json();
  $('status').innerHTML = statuses.map(s => `<option>${esc(s)}</option>`).join('');
  $('adminOnly').classList.toggle('hidden', me.role !== 'admin');
  await loadParcels();
  if (me.role === 'admin') { loadUsers(); loadActivity(); }
}

async function unlock() {
  const r = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('user').value, password: $('pass').value })
  });
  const d = await r.json();
  if (!r.ok) { $('loginMsg').innerHTML = `<p class="error">${esc(d.error)}</p>`; return; }
  token = d.token; me = d.user;
  try { sessionStorage.setItem('gds_token', token); } catch (e) {}
  $('pass').value = '';
  showPanel();
}
$('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

function lock(msg) {
  token = ''; me = null;
  try { sessionStorage.removeItem('gds_token'); } catch (e) {}
  $('panel').classList.add('hidden');
  $('lockBtn').classList.add('hidden');
  $('who').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginMsg').innerHTML = msg ? `<p class="error">${esc(msg)}</p>` : '';
}

// Keep the person signed in if they refresh the page
(async function resume() {
  if (!token) return;
  const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
  if (res.ok) { me = await res.json(); showPanel(); } else { lock(); }
})();

async function changePassword() {
  const r = await api('POST', '/api/me/password', { current: $('curpw').value, next: $('newpw').value });
  $('pwmsg').innerHTML = r.ok ? '<p class="ok">Password changed</p>' : `<p class="error">${esc(r.data.error)}</p>`;
  if (r.ok) { $('curpw').value = ''; $('newpw').value = ''; }
}

async function loadUsers() {
  const r = await api('GET', '/api/users');
  if (!r.ok) return;
  $('users').innerHTML = r.data.map(u => `
    <div class="parcel" style="cursor:default">
      <b>${esc(u.username)}</b> · ${esc(u.full_name)} · ${esc(u.role)} · ${Number(u.active) ? 'active' : '<span class="error">deactivated</span>'}<br>
      <button class="del" style="background:var(--brand)" onclick="resetUserPassword('${esc(u.username)}')">Reset password</button>
      <button class="del" onclick="toggleUser('${esc(u.username)}', ${Number(u.active) ? 'false' : 'true'})">${Number(u.active) ? 'Deactivate' : 'Reactivate'}</button>
    </div>`).join('');
}

async function addUser() {
  const r = await api('POST', '/api/users', {
    username: $('nusername').value, full_name: $('nfull').value, password: $('npass').value, role: $('nrole').value
  });
  $('usermsg').innerHTML = r.ok ? '<p class="ok">Account created</p>' : `<p class="error">${esc(r.data.error)}</p>`;
  if (r.ok) { ['nusername', 'nfull', 'npass'].forEach(id => $(id).value = ''); loadUsers(); loadActivity(); }
}

async function toggleUser(username, active) {
  const r = await api('PATCH', '/api/users/' + encodeURIComponent(username), { active });
  if (!r.ok) alert(r.data.error); else { loadUsers(); loadActivity(); }
}

async function resetUserPassword(username) {
  const pw = prompt('New temporary password for ' + username + ' (8+ characters):');
  if (!pw) return;
  const r = await api('PATCH', '/api/users/' + encodeURIComponent(username), { password: pw });
  alert(r.ok ? 'Password reset' : r.data.error);
}

async function loadActivity() {
  const r = await api('GET', '/api/activity');
  if (!r.ok) return;
  $('activity').innerHTML = r.data.length ? r.data.map(a => `
    <div class="parcel" style="cursor:default">
      <b>${esc(a.action)}</b>${a.detail ? ' · ' + esc(a.detail) : ''}<br>
      <small>${esc(a.username)} · ${esc(a.created_at)} UTC</small><br>
      <button class="del" onclick="deleteActivity(${Number(a.id)})">Delete</button>
    </div>`).join('') : '<small>No activity yet</small>';
}

async function deleteActivity(id) {
  const r = await api('DELETE', '/api/activity/' + id);
  if (!r.ok) { alert(r.data.error); return; }
  loadActivity();
}

async function clearActivity() {
  if (!confirm('Clear the WHOLE activity log? This cannot be undone.')) return;
  const r = await api('DELETE', '/api/activity');
  if (!r.ok) { alert(r.data.error); return; }
  loadActivity();
}

async function loadParcels() {
  const r = await api('GET', '/api/parcels?q=' + encodeURIComponent($('search').value));
  if (r.ok) renderList(r.data);
  if (me && me.role === 'admin') loadActivity();
}

function renderList(rows) {
  lastRows = rows;
  $('list').innerHTML = rows.length ? rows.map(p => `
    <div class="parcel" ${p.can_edit ? `onclick="pick('${esc(p.tracking_number)}')"` : ''}>
      <b>${esc(p.tracking_number)}</b> · ${esc(p.status)}${p.paid ? ' · <b class="ok">PAID</b>' : ''}<br>
      ${esc(p.origin)} → ${esc(p.destination)}<br>
      <small>To: ${esc(p.receiver_name)} ${esc(p.receiver_phone)}${p.created_by ? ' · registered by ' + esc(p.created_by) : ''}</small><br>
      ${p.can_edit ? `<button class="del" style="background:var(--brand)" onclick="event.stopPropagation(); showLabel('${esc(p.tracking_number)}')">Label</button>
        <button class="del" style="background:#2e7d32" onclick="event.stopPropagation(); pickReceipt('${esc(p.tracking_number)}')">Receipt</button>` : '<small>View only (registered by someone else)</small>'}
      ${me && me.role === 'admin' ? `<button class="del" onclick="event.stopPropagation(); removeParcel('${esc(p.tracking_number)}')">Delete</button>` : ''}
    </div>`).join('') : '<small>No parcels yet</small>';
}

/* ---------- Payment receipts ---------- */
const RECEIPT_CSS = `
.rcpt { position: relative; max-width: 340px; margin: 12px auto; background: #fff; border: 1px dashed #999; padding: 16px 14px; font-family: ui-monospace, "Courier New", monospace; font-size: 14px; color: #000; line-height: 1.4; }
.rcpt-logo { display: block; max-width: 90px; max-height: 70px; margin: 0 auto 6px; }
.rcpt-name { text-align: center; font-weight: 700; font-size: 16px; }
.rcpt-small { text-align: center; font-size: 12px; color: #444; }
.rcpt-rule { border-top: 1px dashed #000; margin: 8px 0; }
.rcpt-rule.dbl { border-top: 3px double #000; }
.rcpt-row { display: flex; justify-content: space-between; gap: 10px; margin: 2px 0; }
.rcpt-row b { text-align: right; }
.rcpt-row.big { font-size: 16px; font-weight: 700; }
.rcpt-items { display: grid; grid-template-columns: 1fr 36px auto; gap: 6px; margin: 2px 0; }
.rcpt-items span:nth-child(2) { text-align: center; }
.rcpt-items span:nth-child(3) { text-align: right; }
.rcpt-items.head { font-weight: 700; }
.rcpt-thanks { text-align: center; font-weight: 700; margin: 6px 0; }
.rcpt .qr { text-align: center; margin: 8px 0 2px; }
.rcpt .qr img { width: 130px; height: 130px; image-rendering: pixelated; display: inline-block; }
.rcpt-void { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: rgba(198,40,40,.35); transform: rotate(-20deg); pointer-events: none; }
.rcpt-actions { max-width: 340px; margin: 0 auto; }
`;
document.head.insertAdjacentHTML('beforeend', '<style>' + RECEIPT_CSS + '</style>');

const money = (c) => (Number(c) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const when = (s) => {
  const d = new Date(String(s).replace(' ', 'T') + 'Z');
  return isNaN(d) ? esc(s) : esc(d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }));
};

(function setReceiptDefaults() {
  const S = window.SITE || {};
  $('pcurrency').value = S.currency || 'KES';
  $('ptax').value = S.taxRate != null ? S.taxRate : 16;
})();

function receiptHtml(r) {
  const S = window.SITE || {};
  const logo = S.logo ? (/^(https?:)?\/\//.test(S.logo) ? S.logo : location.origin + '/' + S.logo.replace(/^\/+/, '')) : '';
  const link = location.origin + '/t/' + encodeURIComponent(r.tracking_number);
  const contact = [S.address, S.phone, S.email].filter(Boolean).map(esc).join('<br>');
  const cur = esc(r.currency);
  return `<div id="receiptPrint" class="rcpt" data-no="${esc(r.receipt_no)}">
    ${r.voided ? '<div class="rcpt-void">VOID</div>' : ''}
    ${logo ? `<img class="rcpt-logo" src="${esc(logo)}" alt="">` : ''}
    <div class="rcpt-rule dbl"></div>
    <div class="rcpt-name">${esc(S.name || 'Global Delivery Services')}</div>
    ${contact ? `<div class="rcpt-small">${contact}</div>` : ''}
    <div class="rcpt-rule"></div>
    <div class="rcpt-row"><span>Receipt No:</span><b>${esc(r.receipt_no)}</b></div>
    <div class="rcpt-row"><span>Date:</span><b>${when(r.created_at)}</b></div>
    <div class="rcpt-row"><span>Tracking No:</span><b>${esc(r.tracking_number)}</b></div>
    ${r.paid_by ? `<div class="rcpt-row"><span>Received from:</span><b>${esc(r.paid_by)}</b></div>` : ''}
    <div class="rcpt-row"><span>Route:</span><b>${esc(r.origin)} → ${esc(r.destination)}</b></div>
    <div class="rcpt-rule"></div>
    <div class="rcpt-items head"><span>ITEM</span><span>QTY</span><span>TOTAL</span></div>
    <div class="rcpt-items"><span>${esc(r.item)}</span><span>${Number(r.qty)}</span><span>${cur} ${money(r.subtotal_cents)}</span></div>
    <div class="rcpt-rule"></div>
    <div class="rcpt-row"><span>Subtotal:</span><b>${cur} ${money(r.subtotal_cents)}</b></div>
    <div class="rcpt-row"><span>Tax (${Number(r.tax_rate)}%):</span><b>${cur} ${money(r.tax_cents)}</b></div>
    <div class="rcpt-row big"><span>TOTAL:</span><b>${cur} ${money(r.total_cents)}</b></div>
    <div class="rcpt-row"><span>Paid by:</span><b>${esc(r.method)}</b></div>
    <div class="rcpt-row"><span>Served by:</span><b>${esc(r.served_by || '')}</b></div>
    <div class="rcpt-rule dbl"></div>
    <div class="rcpt-thanks">Thank you for your business!</div>
    <div class="qr" data-qr="${esc(link)}"></div>
    <div class="rcpt-small">Scan to track this parcel</div>
  </div>
  <div class="rcpt-actions">
    <button type="button" onclick="printReceipt()">Print / Save as PDF</button>
    <button type="button" style="background:var(--brand)" onclick="downloadReceiptImage()">Download image</button>
    ${me && me.role === 'admin' && !r.voided ? `<button type="button" class="del" style="background:#c62828" onclick="voidReceipt(${Number(r.id)})">Void receipt</button>` : ''}
  </div>`;
}

// Prints only the receipt (opens a small clean window, so nothing else from this page is printed)
function printReceipt() {
  const el = $('receiptPrint');
  if (!el) return;
  const w = window.open('', '_blank', 'width=420,height=700');
  if (!w) { window.print(); return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Receipt</title><style>'
    + RECEIPT_CSS + '@page { size: 80mm auto; margin: 4mm; } body { margin: 0; background: #fff; } .rcpt { border: 0; margin: 0 auto; }'
    + '</style></head><body>' + el.outerHTML + '</body></html>');
  w.document.close();
  w.focus();
  setTimeout(() => { w.print(); }, 500);
}

// Saves the receipt as ONE picture (PNG)
async function captureReceipt(el, withLogo) {
  const canvas = await html2canvas(el, {
    backgroundColor: '#ffffff', scale: 3, useCORS: true, scrollX: 0, scrollY: -window.scrollY,
    ignoreElements: (n) => !withLogo && n.classList && n.classList.contains('rcpt-logo')
  });
  return canvas.toDataURL('image/png');
}

async function downloadReceiptImage() {
  const el = $('receiptPrint');
  if (!el) return;
  let url;
  try { url = await captureReceipt(el, true); }
  catch (e) {
    try { url = await captureReceipt(el, false); }   // second try without the logo picture
    catch (e2) { alert('Could not make the image. Refresh the page (Ctrl + F5) and try again, or use Print / Save as PDF.'); return; }
  }
  const a = document.createElement('a');
  a.href = url;
  a.download = 'receipt-' + (el.dataset.no || 'payment') + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function viewReceipt(id) {
  const r = await api('GET', '/api/receipts/' + Number(id));
  if (!r.ok) { $('receiptView').innerHTML = `<p class="error">${esc(r.data.error)}</p>`; return; }
  $('receiptView').innerHTML = receiptHtml(r.data);
  renderQRs($('receiptView'));
  $('receiptView').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function loadReceipts() {
  const code = extractCode($('pcode').value);
  if (!code) { $('receiptList').innerHTML = ''; return; }
  const r = await api('GET', '/api/parcels/' + encodeURIComponent(code) + '/payments');
  if (!r.ok) { $('receiptList').innerHTML = `<p class="error">${esc(r.data.error)}</p>`; return; }
  $('receiptList').innerHTML = r.data.length
    ? '<p><b>Receipts for this parcel</b></p>' + r.data.map(x => `
      <div class="parcel" style="cursor:default">
        <b>${esc(x.receipt_no)}</b> · ${esc(x.currency)} ${money(x.total_cents)}${x.voided ? ' · <span class="error">VOID</span>' : ''}<br>
        <small>${when(x.created_at)}</small>
        <button class="del" style="background:var(--brand)" onclick="viewReceipt(${Number(x.id)})">View</button>
      </div>`).join('')
    : '<small>No receipts for this parcel yet.</small>';
}

function pickReceipt(code) {
  const row = lastRows.find(p => p.tracking_number === code);
  $('pcode').value = code;
  $('ppaidby').value = row ? row.sender_name : '';
  $('receiptView').innerHTML = '';
  $('receiptMsg').innerHTML = '';
  loadReceipts();
  $('pcode').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function issueReceipt() {
  const code = extractCode($('pcode').value);
  if (!code) { $('receiptMsg').innerHTML = '<p class="error">Enter the tracking number first</p>'; return; }
  const r = await api('POST', '/api/parcels/' + encodeURIComponent(code) + '/payments', {
    item: $('pitem').value, qty: $('pqty').value, amount: $('pamount').value, currency: $('pcurrency').value,
    tax_rate: $('ptax').value, method: $('pmethod').value, paid_by: $('ppaidby').value
  });
  if (!r.ok) { $('receiptMsg').innerHTML = `<p class="error">${esc(r.data.error)}</p>`; return; }
  $('receiptMsg').innerHTML = `<p class="ok">Receipt ${esc(r.data.receipt_no)} issued.</p>`;
  $('pamount').value = '';
  await loadReceipts();
  await viewReceipt(r.data.id);
  loadParcels();
}

async function voidReceipt(id) {
  if (!confirm('Void this receipt? It stays on record marked VOID and cannot be undone.')) return;
  const r = await api('POST', '/api/receipts/' + Number(id) + '/void');
  if (!r.ok) { alert(r.data.error); return; }
  await loadReceipts();
  await viewReceipt(id);
  loadParcels();
}

function pick(code) { $('ucode').value = code; window.scrollTo({ top: 0, behavior: 'smooth' }); }

async function removeParcel(code) {
  if (!confirm('Delete ' + code + ' and all its history? This cannot be undone.')) return;
  const r = await api('DELETE', '/api/parcels/' + encodeURIComponent(code));
  if (!r.ok) { alert(r.data.error); return; }
  loadParcels();
}

async function createParcel() {
  const r = await api('POST', '/api/parcels', {
    tracking_number: $('tnum').value,
    sender_name: $('sname').value, sender_phone: $('sphone').value,
    receiver_name: $('rname').value, receiver_phone: $('rphone').value,
    origin: $('origin').value, destination: $('dest').value,
    description: $('desc').value, weight_kg: $('weight').value, transport: $('transport').value
  });
  if (r.ok) {
    $('created').innerHTML = labelHtml(r.data.tracking_number, 'Parcel created. Print this label for the parcel:');
    renderBarcodes($('created'));
    renderQRs($('created'));
    $('ucode').value = r.data.tracking_number;
    ['tnum','sname','sphone','rname','rphone','origin','dest','desc','weight','transport'].forEach(id => $(id).value = '');
    loadParcels();
  } else {
    $('created').innerHTML = `<p class="error">${esc(r.data.error)}</p>`;
  }
}

async function addEvent() {
  const r = await api('POST', '/api/parcels/' + encodeURIComponent(extractCode($('ucode').value)) + '/events', {
    status: $('status').value, location: $('location').value, transport: $('utransport').value, note: $('note').value
  });
  $('updated').innerHTML = r.ok ? '<p class="ok">Updated</p>' : `<p class="error">${esc(r.data.error)}</p>`;
  if (r.ok) loadParcels();
}
</script>
</body>
</html>
